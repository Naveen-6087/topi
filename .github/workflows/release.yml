name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rustflags: -C target-cpu=x86-64-v3 -C target-feature=+aes,+pclmulqdq
          - os: macos-latest
            target: aarch64-apple-darwin
            rustflags: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: -C target-cpu=x86-64-v3 -C target-feature=+aes,+pclmulqdq
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }} --bin topi-node --bin topi-client --bin topi
      - name: Package
        shell: bash
        run: |
          name=topi-${{ matrix.target }}
          mkdir "$name"
          for b in topi-node topi-client topi; do
            cp "target/${{ matrix.target }}/release/$b$( [ "${{ runner.os }}" = Windows ] && echo .exe )" "$name/"
          done
          cp LICENSE-MIT LICENSE-APACHE README.md "$name/"
          if [ "${{ runner.os }}" = Windows ]; then 7z a "$name.zip" "$name" >/dev/null; else tar -czf "$name.tar.gz" "$name"; fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: topi-*.*
          generate_release_notes: true

  sdk:
    name: Publish SDK
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_SDK == 'true' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build --workspace sdk
      - run: npm publish --workspace sdk --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
