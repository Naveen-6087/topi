[package]
name = "topi-tui"
version = "0.1.0"
description = "Terminal control room & post-quantum private wallet for the Topi mixnet"
default-run = "topi"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "README.md"
repository = "https://github.com/Naveen-6087/topi"

[dependencies]
getrandom = "0.4.3"
hex.workspace = true
ratatui = "0.30.2"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
ureq = { version = "2", features = ["json"] }
include_dir = "0.7"
topi-mixnet = { workspace = true }
