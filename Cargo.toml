[workspace]
resolver = "3"
members = ["crates/sphinx", "crates/ratelimit", "crates/mixnet", "crates/console"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
topi-sphinx = { path = "crates/sphinx" }
topi-ratelimit = { path = "crates/ratelimit" }
topi-mixnet = { path = "crates/mixnet" }
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4.3"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
tokio = { version = "1.53.3", features = ["full"] }

[profile.release]
lto = "thin"

# Binius proving is far too slow unoptimised; optimise dependencies in dev and test builds too.
[profile.dev.package."*"]
opt-level = 3
